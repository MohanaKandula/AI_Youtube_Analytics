services:
  - type: web
    name: tutortrace-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 2 --bind 0.0.0.0:$PORT --timeout 120 app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tutortrace-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ai-youtube-analytics-iota.vercel.app,http://localhost:5173"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

databases:
  - name: tutortrace-db
    databaseName: tutortrace
    user: tutortrace_user
    plan: free
